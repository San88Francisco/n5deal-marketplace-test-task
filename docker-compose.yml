services:
  mysql:
    image: mysql:8.4
    container_name: n5deal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: n5deal
      MYSQL_USER: n5deal
      MYSQL_PASSWORD: n5deal
    ports:
      - "3306:3306"
    volumes:
      - n5deal-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  n5deal-mysql-data:
